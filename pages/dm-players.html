<div class="dm-page" id="dm-players" style="display:none;">
  <div class="dm-page-header">
    <h2>Players</h2>
    <p class="dm-page-subtitle" id="dmPlayersSubtitle">Your campaign's players</p>
  </div>

  <div class="dm-card">
    <div class="dm-card-header">
      <h3>Party</h3>
      <div class="dmc-row">
        <button class="dm-action-btn" onclick="dmcSendToParty()" title="Set the encounter builder's party from these levels">Use in encounter builder</button>
        <button class="dm-action-btn" onclick="dmcAddPlayer()">+ Add player</button>
      </div>
    </div>
    <p class="dm-note">This is your own list. Type in what you want to track and update it when your players level up. Nothing is pulled from their character sheets.</p>
    <div id="dmcPlayersBody"></div>
  </div>
</div>

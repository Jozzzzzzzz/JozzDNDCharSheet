<!-- Warning Banner -->
<div id="rollingBanner" class="rolling-banner" aria-live="polite">
  <span id="rollingBannerText" class="rolling-banner-text">This sheet autosaves character data to your browser. Use Export to back up your character.</span>
  <button type="button" class="gr-banner-toggle" id="grBannerToggle" aria-label="Shrink banner" aria-expanded="true" title="Shrink / expand banner">
    <svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-chevron-right"/></svg>
  </button>
</div>

<!-- Admin Preview Banner -->
<div id="adminPreviewBanner" class="admin-preview-banner" style="display:none;" aria-live="polite">
  <div id="adminPreviewBannerText" class="admin-preview-banner-text">ADMIN PREVIEW</div>
  <button type="button" class="admin-preview-exit" onclick="exitAdminPreview()">Exit Preview</button>
</div>

<!-- Side rail: Home, the five sheet tabs, live vitals, Save and Settings.
     It replaces the top bar and tab row, giving the page the full height of the screen.
     (.header-bar / .tabs classes are kept so the existing button styles and code keep working.) -->
<aside class="gr-rail" id="grRail" aria-label="Sheet navigation">
  <button type="button" class="gr-rail-toggle" id="grRailToggle" title="Show / hide labels" aria-label="Show or hide labels" aria-expanded="false">
    <svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-chevron-right"/></svg>
  </button>

  <div class="header-bar gr-rail-group">
    <button type="button" onclick="showHomePage()" class="header-btn home-header-btn gr-rail-btn" title="Home (H)" aria-label="Home">
      <svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-home"/></svg><span class="gr-lbl">Home</span>
      <span id="homeNewBadge" class="home-new-badge" style="display:none;">NEW</span>
    </button>
  </div>

  <nav class="tabs gr-rail-tabs" aria-label="Sheet sections">
    <button type="button" class="tab active" data-tab="page1" onclick="switchTab(this)" title="Stats (1)" aria-label="Stats"><svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-user"/></svg><span class="gr-lbl">Stats</span></button>
    <button type="button" class="tab" data-tab="page2" onclick="switchTab(this)" title="Background (2)" aria-label="Background"><svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-book"/></svg><span class="gr-lbl">Background</span></button>
    <button type="button" class="tab" data-tab="page3" onclick="switchTab(this)" title="Spells (3)" aria-label="Spells"><svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-sparkles"/></svg><span class="gr-lbl">Spells</span></button>
    <button type="button" class="tab" data-tab="page4" onclick="switchTab(this)" title="Inventory (4)" aria-label="Inventory"><svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-bag"/></svg><span class="gr-lbl">Inventory</span></button>
    <button type="button" class="tab" data-tab="page6" onclick="switchTab(this)" title="Notes (5)" aria-label="Notes"><svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-quill"/></svg><span class="gr-lbl">Notes</span></button>
  </nav>

  <div class="gr-rail-vitals" id="grRailVitals" hidden>
    <div class="gr-rv gr-rv-hp" id="grRvHp" data-level="ok" title="Hit points">
      <svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-heart"/></svg>
      <span class="gr-rv-num" id="grRvHpText">–</span>
      <span class="gr-rv-bar"><i></i></span>
    </div>
    <div class="gr-rv gr-rv-ac" id="grRvAc" title="Armor class">
      <svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-shield"/></svg>
      <span class="gr-rv-num" id="grRvAcText">–</span>
    </div>
  </div>

  <div class="header-bar gr-rail-group gr-rail-bottom">
    <button type="button" onclick="manualSave(this)" class="header-btn gr-rail-btn gr-savebtn" title="Save &amp; sync now" aria-label="Save">
      <svg class="gr-i gr-todo" aria-hidden="true"><use href="assets/icons.svg#i-save"/></svg>
      <svg class="gr-i gr-done" aria-hidden="true"><use href="assets/icons.svg#i-check"/></svg>
      <span class="gr-lbl gr-lbl-todo">Save</span><span class="gr-lbl gr-lbl-done">Saved</span>
    </button>
    <button type="button" id="grAdminBtn" hidden onclick="openAdminPage()" class="header-btn gr-rail-btn" title="Admin: users, their sheets, campaigns" aria-label="Admin">
      <svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-users"/></svg><span class="gr-lbl">Admin</span>
    </button>
    <button type="button" onclick="openSettingsPage()" class="header-btn gr-rail-btn" title="Settings" aria-label="Settings">
      <svg class="gr-i" aria-hidden="true"><use href="assets/icons.svg#i-gear"/></svg><span class="gr-lbl">Settings</span>
    </button>
  </div>
</aside>
<div class="gr-rail-scrim" id="grRailScrim" hidden></div>
